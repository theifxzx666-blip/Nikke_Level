       font:15px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

  <div class="card">
    <h1>NIKKE 练度中转 <span class="ok">运行中</span></h1>
    <p>这是给战力计算器用的转发服务，本身没有界面。</p>
    <p>接口：<code>/api/relay</code>（GET，需请求头 <code>X-API-KEY</code>）</p>
    <p>只做三件事：放行指定来源的跨域、替你带上 Key 去请求上游、把结果原样送回。Key 不记录、不落盘。</p>
  </div>
