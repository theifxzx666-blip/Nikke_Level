<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIKKE 头像 · 名称图文核对</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#101725;color:#ecf3fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#172336,#101725 58%);min-height:100vh}header{padding:32px max(20px,calc((100vw - 1200px)/2));border-bottom:1px solid #344459}h1{font-size:27px;margin:0 0 8px}p{color:#b8c8da;line-height:1.6}a{color:#8dd7f7}.lead{max-width:980px}.bar{position:sticky;top:0;z-index:3;background:#121e2ded;border-bottom:1px solid #344459;padding:12px max(20px,calc((100vw - 1200px)/2));display:flex;gap:10px;flex-wrap:wrap;align-items:center;backdrop-filter:blur(12px)}input,select,button{font:inherit;color:#ecf3fb;border:1px solid #556980;background:#1d3047;border-radius:8px;padding:9px 12px}input{min-width:0;flex:1 1 235px}button{cursor:pointer}button:hover{border-color:#6bcae9}#count{color:#8dd7f7;margin-left:auto}main{max-width:1240px;margin:auto;padding:20px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{border:1px solid #35485f;border-radius:13px;background:#192638;padding:16px;display:flex;gap:13px;min-height:181px}.card img{width:100px;height:100px;object-fit:contain;image-rendering:auto;background:repeating-conic-gradient(#607080 0 25%,#425069 0 50%) 50%/18px 18px;border-radius:11px;flex:none}.detail{min-width:0;overflow-wrap:anywhere}.detail strong{font-size:16px}.code{font:12px/1.5 Consolas,monospace;color:#a9bbcb;margin:6px 0}.meta{font-size:13px;color:#ccd8e3;line-height:1.55}.note{color:#96afc7;font-size:12px;line-height:1.5;margin-top:5px}.tag{display:inline-block;background:#284866;color:#bce4ff;font-size:12px;border-radius:6px;padding:3px 6px;margin-bottom:7px}.tag.warn{background:#654732;color:#ffdfb0}.tag.confirmed{background:#255046;color:#b2ebd1}.hint{padding:13px 16px;border:1px solid #43607b;background:#1d3044;border-radius:10px;margin:0 0 18px}#error{color:#ffadad}footer{padding:24px;color:#9eb4cc;text-align:center} @media(max-width:620px){header{padding:22px 16px}.bar{padding:10px 16px}main{padding:14px}#count{margin-left:0}.card img{width:88px;height:88px}}
.reviewbar{position:sticky;top:67px;z-index:2;background:#203048f5;border:1px solid #46617c;border-radius:10px;padding:12px;margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.reviewbar strong{color:#bce4ff}.reviewbar button{background:#295874}.reviewbar small{color:#b8c8da}.review-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.review-actions button{font-size:12px;padding:6px 8px}.review-actions input{font-size:13px;flex:1 1 135px;width:100%;padding:7px 9px}.review-state{color:#b2ebd1;font-size:12px;margin-top:7px}.review-output{width:100%;min-height:85px;resize:vertical;background:#142238;color:#e6f4ff;border:1px solid #46617c;border-radius:8px;padding:10px;display:none}.review-output.visible{display:block}.reviewbar button:focus-visible,.review-actions button:focus-visible,.review-actions input:focus-visible{outline:2px solid #9bdbff;outline-offset:2px}@media(max-width:620px){.reviewbar{top:0}.reviewbar button{flex:1 1 auto}.review-actions button{flex:1 1 auto}}
</style><script src="data.js?v=20261106b"></script></head>
<body><header><h1>角色头像 · 名称图文核对</h1><p class="lead">逐张显示本站的 SI 素材实图。空名不等于错名；“客户端同号文本”只作为线索，<b>不能直接替代皮肤显示名，也不能覆盖你已裁定的 9xx 错位条目</b>。点“名称正确”或填写游戏内显示名即可自动暂存；最后点“复制核对成果”发给我。仅复制你主动核对过的项目，不会自动更改站点数据。</p><p><a href="index.html">← 打开修复后的头像预览</a></p></header>
<div class="bar"><input type="search" id="q" placeholder="按资源键、姓名或客户端文本搜索"><select id="group" aria-label="核对分类"><option value="priority">优先核对（有客户端线索）</option><option value="unnamed">全部 106 个空名</option><option value="other">其余无同号显示证据</option><option value="confirmed">历史已裁定：9xx 错位（只供参考）</option><option value="all">全部 110 项</option></select><span id="count"></span></div>
<main><section class="reviewbar" aria-label="核对成果"><strong id="progress">已核对 0 张</strong><button type="button" id="submit-review">提交给助手</button><button type="button" id="copy-review">复制核对成果</button><button type="button" id="download-review">下载 TXT 备份</button><small id="feedback" role="status">仅本机提交，用于助手据此修改站点数据。</small><textarea id="review-output" class="review-output" readonly aria-label="复制结果"></textarea></section><div class="hint" id="explain"></div><div id="error"></div><div id="cards"></div></main><footer>国服文本来源：Locale_Character / Locale_CharacterCostume；仅展示已核实的键和值，未改动站点数据。</footer>
<script>
(function(){'use strict';
const D=window.NIKKE_DATA, q=document.getElementById('q'), group=document.getElementById('group'), cards=document.getElementById('cards');
if(!D){document.getElementById('error').textContent='data.js 未加载；请通过同目录的本地预览服务访问本页。';return}
const base={11:'尼恩',82:'丽塔',210:'艾可希雅',233:'桃乐丝',260:'神罚'};
const costume={82:{key:'82_80_costume_name',name:'黄发垂髫'},233:{key:'233_80_costume_name',name:'宴桃源'},260:{key:'260_80_costume_name',name:'蝶恋花语'}};
const prior={si_c939_00_s:'多万',si_c941_00_s:'皮娜',si_c943_00_s:'莉莉维丝',si_c961_00_s:'奥斯华'};
const data=D.头像.filter(x=>!x.中文名).map(x=>{const id=x.角色号;let type='other',clue='',note='未取得对应 SI 素材的客户端显示名；请凭游戏内界面核对，勿凭编号猜测。';
 if(x.名称依据){type='confirmed';note='这一张已在前次由你确认编号与角色表错位；保持空名，不以同号角色名覆盖。';clue='同号角色名不适用';}
 else if(costume[id]&&x.皮肤==='80'){type='priority';clue=costume[id].name;note='国服客户端 Locale_CharacterCostume：'+costume[id].key+'；请核对图像是否对应这套时装。';}
 else if(base[id]){type='priority';clue=base[id];note='国服 Locale_Character 的 '+id+'_name 仅为基础角色名；变体 '+(x.皮肤||'未标注')+' 尚无对应时装名键，需你核对实图。';}
 return {raw:x,type,clue,note};});
// 这四项此前已获人工裁定，并非本次待改名；另列参考图避免同号误认。
for(const [key,name] of Object.entries(prior)){const x=D.头像.find(a=>a.名称===key);if(x)data.push({raw:x,type:'known',clue:name,note:'既有人工裁定（名称依据：'+(x.名称依据||'记录缺失')+'）。此栏仅供对照，不请求重复裁定。'});}
const STORAGE_KEY='nikke-avatar-review-v1', DRAFT_KEY='nikke-avatar-review-draft-v1', editable=data.filter(x=>x.type!=='known'&&x.type!=='confirmed');
let saved={},drafts={};try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))saved=raw;}catch{}
try{const raw=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))drafts=raw;}catch{}
function persistDrafts(){try{if(Object.keys(drafts).length)localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));else localStorage.removeItem(DRAFT_KEY);}catch{}}
const progress=document.getElementById('progress'),feedback=document.getElementById('feedback'),output=document.getElementById('review-output');
function updateProgress(){const n=editable.filter(x=>saved[x.raw.名称]).length;progress.textContent='已核对 '+n+' / '+editable.length+' 张';}
function save(key,value){if(value)saved[key]=value;else delete saved[key];delete drafts[key];persistDrafts();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));feedback.textContent='已保存在此浏览器；复制或下载备份以免清缓存丢失。';}catch{feedback.textContent='浏览器禁止本地保存，请立即复制或下载成果。';}updateProgress();render();}
function resultText(){const lines=['NIKKE SI 头像命名核对（仅含主动核对项）'];for(const x of editable){const v=saved[x.raw.名称];if(!v)continue;const name=v.status==='matched'?v.name:v.status==='named'?v.name:'';lines.push(x.raw.名称+' → '+(v.status==='uncertain'?'存疑，暂不修改':name+(v.status==='matched'?'（客户端时装名与图吻合）':'（游戏内显示名）')));}return lines.length===1?'尚未核对任何条目。':lines.join('\n');}
function render(){const g=group.value,t=q.value.trim().toLowerCase();const visible=data.filter(x=>{if(g==='priority'&&x.type!=='priority')return false;if(g==='unnamed'&&x.raw.中文名)return false;if(g==='other'&&x.type!=='other')return false;if(g==='confirmed'&&x.type!=='confirmed'&&x.type!=='known')return false;return !t||(x.raw.名称+' '+(x.raw.中文名||'')+' '+x.clue+' '+x.note).toLowerCase().includes(t)});
const notes={priority:'优先核对 5 张：其中 3 张找到国服时装显示键，2 张只有基础角色名，均须把文字与实图对应。',unnamed:'展示全部 '+data.filter(x=>!x.raw.中文名).length+' 张本站未填写中文名的头像。无客户端对应文本时保持空白，等待你核对。',other:'其余无可直接对应的客户端显示文本；包含特殊、NPC 和活动编号，不按角色编号硬填。',confirmed:'四张已裁定错位的空名头像，与四张已由你辨认的正确资源并排参考。',all:'展示 '+data.filter(x=>!x.raw.中文名).length+' 张空名头像加 4 张历史已裁定的对照资源。'};
 document.getElementById('explain').textContent=notes[g];document.getElementById('count').textContent=visible.length+' / '+data.length+' 张';cards.replaceChildren();const frag=document.createDocumentFragment();
 for(const x of visible){const v=x.raw,c=document.createElement('article');c.className='card';c.dataset.key=v.名称;const im=document.createElement('img');im.src=D.资源根+v.文件;im.loading='lazy';im.alt='素材 '+v.名称;c.append(im);const box=document.createElement('div');box.className='detail';const tag=document.createElement('span');tag.className='tag '+(x.type==='priority'?'warn':x.type==='known'?'confirmed':'');tag.textContent=x.type==='priority'?(costume[v.角色号]&&v.皮肤==='80'?'客户端时装名 · 待核图':'基础角色名 · 待核图'):x.type==='known'?'已确认，勿重复改名':x.type==='confirmed'?'已确认编号错位': '无明确显示名';box.append(tag);const strong=document.createElement('strong');strong.textContent=v.中文名||'当前中文名：空';box.append(strong);const code=document.createElement('div');code.className='code';code.textContent=v.名称;box.append(code);const clue=document.createElement('div');clue.className='meta';clue.textContent='客户端线索：'+(x.clue||'未查到可直接对应的名称');box.append(clue);const note=document.createElement('div');note.className='note';note.textContent=x.note;box.append(note);
 if(x.type!=='known'&&x.type!=='confirmed'){const current=saved[v.名称];const actions=document.createElement('div');actions.className='review-actions';if(x.type==='priority'&&costume[v.角色号]&&v.皮肤==='80'){const yes=document.createElement('button');yes.type='button';yes.dataset.action='matched';yes.textContent='图与时装名吻合';actions.append(yes);}const field=document.createElement('input');field.type='text';field.maxLength=80;field.placeholder='游戏内显示名（填写后点保存）';field.setAttribute('aria-label',v.名称+' 游戏内显示名');field.value=current&&current.status==='named'?current.name:(drafts[v.名称]||'');field.addEventListener('input',()=>{const val=field.value.trim();if(val)drafts[v.名称]=field.value;else delete drafts[v.名称];persistDrafts();});actions.append(field);for(const [action,label] of [['named','保存名称'],['uncertain','标记存疑'],['clear','撤销核对']]){const b=document.createElement('button');b.type='button';b.dataset.action=action;b.textContent=label;actions.append(b);}box.append(actions);const state=document.createElement('div');state.className='review-state';state.textContent=current?(current.status==='matched'?'已确认图与客户端时装名吻合':current.status==='named'?'已记录：'+current.name:'已标记存疑'):'未核对';box.append(state);}c.append(box);frag.append(c)}cards.append(frag);}
cards.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const card=button.closest('.card'),key=card.dataset.key,x=editable.find(v=>v.raw.名称===key);if(!x)return;const action=button.dataset.action;if(action==='matched'&&x.type==='priority'&&costume[x.raw.角色号]&&x.raw.皮肤==='80')save(key,{status:'matched',name:x.clue});else if(action==='named'){const name=card.querySelector('input').value.trim();if(!name){feedback.textContent='请先填写游戏内显示名，再点保存。';card.querySelector('input').focus();return;}save(key,{status:'named',name});}else if(action==='uncertain')save(key,{status:'uncertain'});else if(action==='clear')save(key,null);});
cards.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.review-actions input')){e.preventDefault();e.target.closest('.review-actions').querySelector('button[data-action="named"]').click();}});
document.getElementById('copy-review').addEventListener('click',async()=>{const text=resultText();if(!Object.keys(saved).some(k=>editable.some(x=>x.raw.名称===k))){feedback.textContent='还没有核对成果，请先选择或填写一项。';return;}try{await navigator.clipboard.writeText(text);feedback.textContent='已复制！直接粘贴到对话发给我。';output.classList.remove('visible');}catch{output.value=text;output.classList.add('visible');output.focus();output.select();feedback.textContent='自动复制不可用；请手动复制下方已选中的文本。';}});
document.getElementById('download-review').addEventListener('click',()=>{const text=resultText();if(text==='尚未核对任何条目。'){feedback.textContent='还没有核对成果，请先选择或填写一项。';return;}const blob=new Blob(['\ufeff',text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NIKKE头像命名核对成果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback.textContent='已下载 TXT 备份，可粘贴内容到对话。';});
document.getElementById('submit-review').addEventListener('click',async()=>{const btn=document.getElementById('submit-review'),entries={};for(const [k,v] of Object.entries(saved))if(editable.some(x=>x.raw.名称===k))entries[k]=v;const count=Object.keys(entries).length;if(!count){feedback.textContent='还没有已保存的核对结果，请先选择或填写一项。';return;}btn.disabled=true;feedback.textContent='正在提交 '+count+' 项…';try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({核对:entries,文本:resultText()})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));feedback.textContent='已提交 '+j.count+' 项给助手，可直接回到对话说“可以修改”。';}catch(e){feedback.textContent='提交失败（'+e.message+'）：本页可能不是通过本地服务打开，请改用 http://127.0.0.1:19328/命名核对_20261106.html。';}finally{btn.disabled=false;}});
q.addEventListener('input',render);group.addEventListener('change',render);const emptyN=data.filter(x=>!x.raw.中文名).length;group.querySelector('option[value="unnamed"]').textContent='全部 '+emptyN+' 个空名';group.querySelector('option[value="all"]').textContent='全部 '+data.length+' 项';if(!data.some(x=>x.type==='priority')){group.value='unnamed';group.querySelector('option[value="priority"]').remove();}updateProgress();render();
const restored=Object.keys(saved).length,draftN=Object.keys(drafts).length;if(restored||draftN)feedback.textContent=(restored?'已恢复 '+restored+' 项已保存的核对结果':'尚未保存核对结果')+(draftN?'；另找回 '+draftN+' 条未点“保存名称”的输入，未计入结果，请逐条确认保存':'')+'。';
})();
</script></body></html>
